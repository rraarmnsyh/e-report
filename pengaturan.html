<!DOCTYPE html>
<html lang="id" data-bs-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report Santri</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/fx.css">
</head>
<body>
    <nav class="navbar topbar px-4">
        <a href="dashboard.html" class="navbar-brand text-white fw-bold">E-Report <span class="brand-light">Santri</span></a>
        <div class="admin-profile">
            <div><span>Admin</span><small>Pengelola sistem</small></div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row g-0">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="dashboard.html" class="menu-link"><i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statistik.html" class="menu-link"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="pengaturan.html" class="menu-link active"><i class="bi bi-gear"></i> Pengaturan</a>
            <a href="index.html" class="menu-link mt-auto"><i class="bi bi-box-arrow-up-right"></i> Lihat Situs</a>
        </aside>
        <main class="col-lg-10 p-4">
           <h2>Pengaturan Sistem</h2>
           <p>kelola informasi admin</p>


           <div class="row">
            <div class="col-lg-6">
              <div class="card h-100">
                <div class="card-header">
                  <h5> <i class="bi bi-person-circle"></i> Administrator</h5>
                </div>

                <div class="card-body">
                   <form action="">
                    <div class="mb-3">

                      <label for="" class="form-label">Nama Admin</label>
                      <input type="text" value="Admin Santri" class="form-control">
                    </div>
                    <div class="mb-3">

                      <label for="" class="form-label">Email</label>
                      <input type="text" value="Admin@idn.com" class="form-control">
                    </div>
                    <div class="mb-3">

                      <label for="" class="form-label">Jabatan</label>
                      <input type="text" value="Administrator" class="form-control">
                    </div>
                    <button class="btn btn-primary">
                      <i class="bi bi-floppy"></i>
                      Simpan Profile
                    </button>
                  </form>
                </div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card h-100">
                <div class="card-header">
                  <h5> <i class="bi bi-person-circle"></i> Nama Aplikasi</h5>
                </div>

                <div class="card-body">
                   <form action="">
                    <div class="mb-3">

                      <label for="" class="form-label">Nama Aplikasi</label>
                      <input type="text" value="E-report Santri" class="form-control">
                    </div>
                    <div class="mb-3">

                      <label for="" class="form-label">Nama Sekolah</label>
                      <input type="text" value="IDNBS" class="form-control">
                    </div>
                    <div class="mb-3">

                      <label for="" class="form-label">Deskripsi Aplikasi</label>
                      <input type="text" value="Sistem pelaporan pelanggaran santri" class="form-control">
                    </div>
                    <button class="btn btn-primary">
                      <i class="bi bi-check"></i>
                      Simpan Identitas
                    </button>
                  </form>
                </div>
              </div>
            </div>
            <div class="col-lg-6"></div>
           </div>
           <div class="col-lg-12">
            <div class="card">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                <div> 
                  <h5>

                    <i class="bi bi-bell text-warning"></i>
                    Preferensi Sistem
                  </h5>
                </div>
                <div class="form-check form-switch">
                  <input type="checkbox" 
                  class="form-check-input">
                  <label for="" class="form-check-label">
                    Aktifkan Notifikasi
                  </label>

                </div>
                </div>
              </div>
            </div>
           </div>
           
        
           

        </main>
    </div>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/fx.js" defer></script>

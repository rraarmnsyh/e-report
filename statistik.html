<!DOCTYPE html>
<html lang="id" data-bs-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report Santri</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/fx.css">
</head>
<body>
    <nav class="navbar topbar px-4">
        <a href="dashboard.html" class="navbar-brand text-white fw-bold">E-Report <span class="brand-light">Santri</span></a>
        <div class="admin-profile">
            <div><span>Admin</span><small>Pengelola sistem</small></div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row g-0">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="dashboard.html" class="menu-link"><i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statistik.html" class="menu-link active"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="pengaturan.html" class="menu-link"><i class="bi bi-gear"></i> Pengaturan</a>
            <a href="index.html" class="menu-link mt-auto"><i class="bi bi-box-arrow-up-right"></i> Lihat Situs</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Data Laporan Statistik</h2>
            <p class="text-secondary">Ringkasan laporan santri.</p>
            <div class="row g-4">
                <div class="col-lg-8"><div class="card"><div class="card-body">
                    <h5>Statistik Laporan</h5><p class="text-secondary">Jumlah laporan santri setiap bulan</p>
                    <div class="chart-box"><canvas id="santriChart"></canvas></div>
                </div></div></div>
                <div class="col-lg-4"><div class="card h-100"><div class="card-body">
                    <h5>Status Laporan</h5><p class="text-secondary">Laporan santri</p>
                    <div class="chart-box"><canvas id="statusChart"></canvas></div>
                </div></div></div>
            </div>
        </main>
    </div>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ease = {duration: 1400, easing: 'easeOutQuart'};
      const bar = document.getElementById('santriChart').getContext('2d');
      const g = bar.createLinearGradient(0, 0, 0, 320);
      g.addColorStop(0, '#7c5cff'); g.addColorStop(1, '#3b6cff');
      new Chart(bar, {
        type: 'bar',
        data: {labels: ["Januari","Februari","Maret","April","Mei"],
          datasets: [{label: "Jumlah Laporan per-bulan", data: [12,19,3,5,2], backgroundColor: g, hoverBackgroundColor: '#ffc857', borderRadius: 12, borderSkipped: false}]},
        options: {maintainAspectRatio: false, animation: ease, plugins: {legend: {position: 'bottom'}}, scales: {y: {grid: {color: '#e8ecfa'}}, x: {grid: {display: false}}}}
      });
      new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {labels: ["Diterima","Diproses","Ditolak"], datasets: [{data: [12,19,3], backgroundColor: ['#3b6cff','#ffc857','#ff6b81'], borderWidth: 4, borderColor: '#fff', hoverOffset: 14}]},
        options: {maintainAspectRatio: false, cutout: '66%', animation: {...ease, animateRotate: true, animateScale: true}, plugins: {legend: {position: 'bottom'}}}
      });
    </script>
    <script src="assets/fx.js" defer></script>
</body>
</html>
